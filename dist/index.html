<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff9e9"><title>Spice Laboratory — Unalmas kaja kizárva</title><meta name="description" content="Animált Spice Laboratory fejléc koncepció."><style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&family=DM+Sans:wght@400;600;700&display=swap');
:root{--cream:#fff9e9;--ink:#17130f;--pink:#ec75ab;--green:#9bc644;--yellow:#ffd336}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif}header{height:94px;display:flex;align-items:center;justify-content:space-between;padding:0 5%;border-bottom:2px solid var(--ink);position:relative;z-index:4;background:var(--cream)}.brand{font-family:'Barlow Condensed',Impact,sans-serif;font-size:25px;line-height:.86;letter-spacing:-.7px;font-weight:900;transform:rotate(-3deg)}.brand span{display:block}nav{font-size:12px;letter-spacing:1.7px;font-weight:700}.hero{position:relative;overflow:hidden;isolation:isolate;min-height:690px;height:calc(100svh - 94px);max-height:980px;display:flex;align-items:center;padding:65px 7% 95px}.copy{position:relative;z-index:2;max-width:920px;pointer-events:none}.eyebrow{font-size:12px;font-weight:700;letter-spacing:3px;margin-bottom:26px}h1{font-family:'Barlow Condensed',Impact,'Arial Narrow',sans-serif;font-weight:900;font-size:clamp(90px,11.7vw,180px);letter-spacing:-.035em;line-height:.83;margin:0 0 38px}h1 .line{display:block;width:max-content}h1 .line:first-child{transform:rotate(-2deg)}h1 .line:nth-child(2){transform:rotate(1deg);margin-left:5px}h1 .line:last-child{transform:rotate(-2deg);position:relative;padding:0 15px 15px 0}h1 .line:last-child:before{content:'';position:absolute;inset:5% -3% 0 -3%;background:var(--yellow);border-radius:20% 8% 16% 7%;z-index:-1;transform:rotate(1deg)}h1 i{font-style:normal;display:inline-block;transform:rotate(var(--r)) translateY(var(--y))}.cta{display:inline-flex;align-items:center;gap:40px;padding:17px 25px;color:var(--cream);background:var(--ink);border:2px solid var(--ink);border-radius:4px;text-decoration:none;font-size:13px;font-weight:700;pointer-events:auto;transition:transform .2s}.cta:hover{transform:rotate(-2deg) translateY(-3px)}.cta:focus-visible,button:focus-visible{outline:3px solid #a643af;outline-offset:5px}.cta span{font-size:24px;line-height:15px}.art{position:absolute;right:-2%;top:4%;width:53%;height:90%;z-index:0}.blob{position:absolute;width:88%;height:82%;top:7%;left:8%;background:var(--pink);border-radius:40% 58% 35% 65% / 45% 33% 65% 55%;animation:morph 11s ease-in-out infinite alternate;transform:rotate(-12deg)}.green{position:absolute;width:240px;height:200px;right:-80px;bottom:0;background:var(--green);border-radius:40% 60% 60% 40%;animation:float 9s ease-in-out infinite}.mascot{position:absolute;width:94%;height:97%;object-fit:contain;top:1%;left:7%;animation:dance 4s ease-in-out infinite;transform-origin:50% 85%}.particles{position:absolute;inset:0;overflow:hidden;z-index:1;pointer-events:none}.seed{position:absolute;background:var(--ink);width:7px;height:13px;border-radius:60%;animation:drift var(--duration) ease-in-out infinite alternate;animation-delay:var(--delay)}.seed:nth-child(3n){background:var(--green);width:18px;height:8px}.seed:nth-child(4n){background:var(--yellow);width:12px;height:22px}.foot{position:absolute;bottom:26px;left:5%;right:5%;display:flex;align-items:center;justify-content:space-between;font-size:10px;font-weight:700;letter-spacing:2px;z-index:3}.motion{border:1px solid var(--ink);border-radius:40px;background:var(--cream);padding:10px 15px;font:inherit;letter-spacing:1px;cursor:pointer}.paused *{animation-play-state:paused!important}.burst{position:absolute;right:4%;top:6%;font-size:70px;color:var(--yellow);animation:turn 18s linear infinite}.note{padding:18px 5%;border-top:2px solid var(--ink);font-size:11px;letter-spacing:1px;display:flex;justify-content:space-between}
@keyframes dance{0%,100%{transform:rotate(-5deg) translateY(0)}50%{transform:rotate(5deg) translateY(-18px)}}@keyframes morph{to{border-radius:62% 38% 58% 42% / 35% 58% 42% 65%;transform:rotate(9deg)}}@keyframes float{50%{transform:translate(-25px,-30px) rotate(18deg)}}@keyframes drift{to{transform:translate(-35px,75px) rotate(150deg)}}@keyframes turn{to{transform:rotate(360deg)}}
@media(min-width:1600px){.hero{padding-left:max(7%,calc((100vw - 1500px)/2))}}@media(max-width:800px){header{height:76px}.brand{font-size:22px}nav{font-size:9px;letter-spacing:1px}.hero{height:auto;min-height:900px;padding:60px 7% 410px;align-items:flex-start}.eyebrow{font-size:9px;margin-bottom:24px}h1{font-size:clamp(78px,17vw,130px);margin-bottom:28px}.art{width:85%;height:430px;top:auto;bottom:25px;right:-10%}.mascot{width:90%;left:7%}.blob{height:90%;top:0}.green{width:140px;height:100px}.foot{left:7%;right:7%;bottom:20px}.foot>span{max-width:130px;line-height:1.6;font-size:8px}.motion{font-size:8px}.note{font-size:9px}.burst{font-size:50px}.cta{padding:15px 20px;font-size:12px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><header><div class="brand" aria-label="Spice Laboratory">SPICE<span>LABORATORY</span></div><nav>TERMÉSZETESEN. KARAKTERESEN.</nav></header><main><section class="hero" aria-label="Spice Laboratory animált fejléc"><div class="art" aria-hidden="true"><div class="blob"></div><div class="green"></div><img class="mascot" src="assets/mascot.png" alt=""><span class="burst">✳</span></div><div class="particles" aria-hidden="true"></div><div class="copy"><div class="eyebrow">EGY CSIPET. TELJESEN MÁS VILÁG.</div><h1 aria-label="UNALMAS KAJA KIZÁRVA"><span class="line" aria-hidden="true">UNALMAS</span><span class="line" aria-hidden="true">KAJA</span><span class="line" aria-hidden="true">KIZÁRVA</span></h1><a class="cta" href="https://spicelaboratory.ro/">FELFEDEZEM AZ ÍZEKET <span aria-hidden="true">↗</span></a></div><div class="foot"><span>100% TERMÉSZETES ALAPANYAGOK</span><button class="motion" type="button" aria-pressed="false">Ⅱ ANIMÁCIÓ SZÜNET</button></div></section></main><div class="note"><span>SPICE LABORATORY</span><span>FEJLÉCKONCEPCIÓ / 01</span></div><script>
const container=document.querySelector('.particles');for(let i=0;i<26;i++){const p=document.createElement('span');p.className='seed';p.style.cssText=`left:${54+(i*17%45)}%;top:${3+(i*29%86)}%;--duration:${4+i%5}s;--delay:-${i%7}s;transform:rotate(${i*31}deg)`;container.append(p)}document.querySelectorAll('h1 .line').forEach(line=>{const t=line.textContent;line.textContent='';[...t].forEach((c,i)=>{const e=document.createElement('i');e.textContent=c;e.style.setProperty('--r',`${[0,-3,2,-1,3,-2,1][i%7]}deg`);e.style.setProperty('--y',`${[0,1,-1,1,0][i%5]}px`);line.append(e)})});const button=document.querySelector('.motion');let paused=matchMedia('(prefers-reduced-motion:reduce)').matches;function sync(){document.body.classList.toggle('paused',paused);button.setAttribute('aria-pressed',String(paused));button.textContent=paused?'▶ ANIMÁCIÓ INDÍTÁS':'Ⅱ ANIMÁCIÓ SZÜNET'}sync();button.addEventListener('click',()=>{paused=!paused;sync()});
</script></body></html>
